services:
  - type: web
    name: hcm-lite
    runtime: node
    plan: free
    buildCommand: npm ci --prefix server && npm ci --prefix client && npm run build --prefix client
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
